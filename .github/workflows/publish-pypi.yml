name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Validate release tag matches package version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        PACKAGE_VERSION=$(python - <<'PY'
        import ast
        from pathlib import Path

        module = ast.parse(Path("cgull/__init__.py").read_text(encoding="utf-8"))
        for node in module.body:
            if isinstance(node, ast.Assign) and any(
                isinstance(target, ast.Name) and target.id == "__version__"
                for target in node.targets
            ):
                print(ast.literal_eval(node.value))
                break
        else:
            raise SystemExit("Unable to find cgull.__version__")
        PY
        )
        EXPECTED_TAG="v${PACKAGE_VERSION}"
        if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
          echo "Release tag '$RELEASE_TAG' does not match package version '$PACKAGE_VERSION' (expected '$EXPECTED_TAG')." >&2
          exit 1
        fi

    - name: Install build tooling
      run: python -m pip install --user build twine

    - name: Build wheel and source distribution
      run: python -m build

    - name: Validate distribution metadata and README
      run: python -m twine check dist/*

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
