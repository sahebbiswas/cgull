name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # ProcessPoolExecutor teardown can deadlock on Windows/Python 3.10.
          # Python 3.10 remains covered on Linux/macOS; Windows is covered on 3.11+.
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov jsonschema
          python -m pip install -e ".[ast]"

      - name: Run Unit Tests with Coverage
        run: |
          python -m pytest -v --cov=cgull --cov-report=term-missing

      - name: Run Security Rule Behavioral Corpus
        run: |
          # Coverage ratchet: keep this at achieved coverage and raise it whenever coverage grows.
          python tests/run_corpus.py --min-coverage 100.0

      - name: Run Interprocedural Regression Corpus
        run: |
          python benchmarks/run_interprocedural.py

      - name: Run Focused Juliet Benchmark
        run: |
          python benchmarks/run_juliet.py --ci --min-f1 0.90
          python benchmarks/run_juliet.py --manifest benchmarks/juliet/manifest_expanded.json --ci --min-f1 0.90
