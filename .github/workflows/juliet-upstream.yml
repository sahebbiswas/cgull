name: Upstream Juliet Benchmark

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "cgull/rules/**"
      - "benchmarks/run_juliet.py"
      - "benchmarks/run_juliet_upstream.py"
      - "benchmarks/diagnose_juliet_oracle.py"
      - "docs/benchmarks/**"
      - ".github/workflows/juliet-upstream.yml"
  workflow_dispatch:

concurrency:
  group: juliet-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Per-CWE Detection Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout C-GULL
        uses: actions/checkout@v7

      - name: Checkout pinned Juliet 1.3 snapshot
        uses: actions/checkout@v7
        with:
          repository: arichardson/juliet-test-suite-c
          ref: f88433e3443648a17671398797a04ea1f8e1a274
          path: .juliet-upstream
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install C-GULL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ast]"

      - name: Run deterministic upstream benchmark
        run: |
          python benchmarks/run_juliet_upstream.py .juliet-upstream --per-flow 2 --format markdown --output juliet-upstream.md --json-output juliet-upstream.json
          cat juliet-upstream.md
          cat juliet-upstream.md >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose split-file oracle attribution
        run: |
          python benchmarks/diagnose_juliet_oracle.py .juliet-upstream --per-cwe 25 --output juliet-oracle-diagnostic.md
          cat juliet-oracle-diagnostic.md
          cat juliet-oracle-diagnostic.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: juliet-upstream-metrics
          path: |
            juliet-upstream.md
            juliet-upstream.json
            juliet-oracle-diagnostic.md
