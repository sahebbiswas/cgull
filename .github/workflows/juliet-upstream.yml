name: Upstream Juliet Benchmark

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "cgull/rules/**"
      - "benchmarks/run_juliet.py"
      - "benchmarks/run_juliet_upstream.py"
      - "benchmarks/check_juliet_regression.py"
      - "benchmarks/juliet/cgull-049-regression-baseline.json"
      - "benchmarks/diagnose_juliet_oracle.py"
      - "docs/benchmarks/**"
      - ".github/workflows/juliet-upstream.yml"
  workflow_dispatch:
    inputs:
      full_cgull_049:
        description: "Run every upstream CWE-194/195/196/197 testcase entry"
        required: false
        default: false
        type: boolean

concurrency:
  group: juliet-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Per-CWE Detection Metrics
    if: ${{ github.event_name == 'pull_request' || inputs.full_cgull_049 == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout C-GULL
        uses: actions/checkout@v7

      - name: Checkout pinned Juliet 1.3 snapshot
        uses: actions/checkout@v7
        with:
          repository: arichardson/juliet-test-suite-c
          ref: f88433e3443648a17671398797a04ea1f8e1a274
          path: .juliet-upstream
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install C-GULL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ast]"

      - name: Run deterministic upstream benchmark
        run: |
          python benchmarks/run_juliet_upstream.py .juliet-upstream --per-flow 2 --format markdown --output juliet-upstream.md --json-output juliet-upstream.json
          cat juliet-upstream.md
          cat juliet-upstream.md >> "$GITHUB_STEP_SUMMARY"

      - name: Measure full CGULL-042 CWE-563 family
        run: |
          python benchmarks/run_juliet_upstream.py .juliet-upstream --cwe CWE-563 --all --format markdown --output cgull-042-cwe563-full.md --json-output cgull-042-cwe563-full.json
          cat cgull-042-cwe563-full.md
          cat cgull-042-cwe563-full.md >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose split-file oracle attribution
        run: |
          python benchmarks/diagnose_juliet_oracle.py .juliet-upstream --per-cwe 25 --output juliet-oracle-diagnostic.md
          cat juliet-oracle-diagnostic.md
          cat juliet-oracle-diagnostic.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce CGULL-049 regression budget
        run: |
          python benchmarks/check_juliet_regression.py juliet-upstream.json --output cgull-049-regression.md
          cat cgull-049-regression.md
          cat cgull-049-regression.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: juliet-upstream-metrics
          if-no-files-found: warn
          path: |
            juliet-upstream.md
            juliet-upstream.json
            cgull-042-cwe563-full.md
            cgull-042-cwe563-full.json
            juliet-oracle-diagnostic.md
            cgull-049-regression.md

  full-cgull-049:
    name: Full CGULL-049 Juliet Families
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_cgull_049 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout C-GULL
        uses: actions/checkout@v7

      - name: Checkout pinned Juliet 1.3 snapshot
        uses: actions/checkout@v7
        with:
          repository: arichardson/juliet-test-suite-c
          ref: f88433e3443648a17671398797a04ea1f8e1a274
          path: .juliet-upstream
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install C-GULL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ast]"

      - name: Run full CGULL-049 upstream benchmark
        run: |
          python benchmarks/run_juliet_upstream.py .juliet-upstream \
            --cwe CWE-194 --cwe CWE-195 --cwe CWE-196 --cwe CWE-197 --all \
            --format markdown --output cgull-049-full.md --json-output cgull-049-full.json
          cat cgull-049-full.md
          cat cgull-049-full.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full CGULL-049 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: juliet-cgull-049-full
          if-no-files-found: warn
          path: |
            cgull-049-full.md
            cgull-049-full.json
