name: Issue 520 callable-signature benchmark

on:
  push:
    branches:
      - issue-520-callable-signature-tu-cache

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]" psutil
      - name: Run focused callable-signature regressions
        run: |
          pytest -q \
            tests/test_issue_520_callable_signature_cache.py \
            tests/test_issue_359_callable_signatures.py \
            tests/test_issue_347_integer_narrowing_cast.py
      - name: Prepare base worktree
        run: git worktree add /tmp/cgull-520-base 344ea44a5fb2ab4fa665c01ca403a2158416bd68
      - name: Capture 16/48/96-module base and head sweeps
        shell: bash
        run: |
          set -euo pipefail
          for modules in 16 48 96; do
            workspace="/tmp/issue-520-workload-${modules}"
            (
              cd /tmp/cgull-520-base
              PYTHONPATH=/tmp/cgull-520-base python benchmarks/benchmark_medium_project.py \
                --modules "${modules}" \
                --modes file \
                --jobs 1 \
                --repetitions 1 \
                --workspace "${workspace}" \
                --output "$GITHUB_WORKSPACE/issue-520-base-${modules}.json"
            )
            PYTHONPATH="$GITHUB_WORKSPACE" python benchmarks/benchmark_medium_project.py \
              --modules "${modules}" \
              --modes file \
              --jobs 1 \
              --repetitions 1 \
              --workspace "${workspace}" \
              --output "issue-520-head-${modules}.json"
          done
      - name: Compare base and head
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics = (
              "aggregate_file_analysis_seconds",
              "rule_execution_aggregate_seconds",
              "total_wall_seconds",
          )
          comparison = {"sweep": {}}

          for modules in (16, 48, 96):
              base = json.loads(Path(f"issue-520-base-{modules}.json").read_text())
              head = json.loads(Path(f"issue-520-head-{modules}.json").read_text())
              assert base["workload"]["sha256"] == head["workload"]["sha256"]
              assert base["workload"]["physical_lines"] == head["workload"]["physical_lines"]
              assert base["parity"]["passes"] and head["parity"]["passes"]

              before = base["samples"][0]
              after = head["samples"][0]
              assert before["semantics"] == after["semantics"]
              assert before["semantic_digest"] == after["semantic_digest"]

              row = {
                  "physical_lines": head["workload"]["physical_lines"],
                  "workload_sha256": head["workload"]["sha256"],
                  "semantic_parity": True,
                  "base_revision": base["environment"]["cgull_revision"],
                  "head_revision": head["environment"]["cgull_revision"],
                  "metrics": {},
              }
              print(f"modules={modules} physical_lines={row['physical_lines']}")
              for metric in metrics:
                  b = before["phases"][metric]
                  h = after["phases"][metric]
                  reduction = 0.0 if b == 0 else (b - h) / b * 100.0
                  row["metrics"][metric] = {
                      "base_seconds": b,
                      "head_seconds": h,
                      "reduction_percent": reduction,
                  }
                  print(f"  {metric}: {b:.6f}s -> {h:.6f}s ({reduction:+.1f}% reduction)")
              comparison["sweep"][str(modules)] = row

          Path("issue-520-comparison.json").write_text(
              json.dumps(comparison, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: issue-520-base-head-py3.12
          path: |
            issue-520-base-*.json
            issue-520-head-*.json
            issue-520-comparison.json
