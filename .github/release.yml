changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security analysis and rules
      labels:
        - security
        - rule
        - enhancement
    - title: Fixes
      labels:
        - bug
        - bugfix
    - title: Documentation and maintenance
      labels:
        - documentation
        - maintenance
    - title: Other changes
      labels:
        - "*"
