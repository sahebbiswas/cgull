name: 'C-GULL Security Scanner'
description: 'Lightweight, modular C source code static security analyzer'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Target file(s) or directory to scan'
    required: false
    default: '.'
  severity:
    description: 'Severity filter threshold (high, medium, low, all)'
    required: false
    default: 'all'
  fail-on:
    description: 'Exit with error if issues at or above severity threshold are found (high, medium, low, all, none)'
    required: false
    default: 'high'
  format:
    description: 'Report format (sarif, text, json, markdown)'
    required: false
    default: 'sarif'
  sarif-file:
    description: 'Output SARIF file path (used when format is sarif or upload-sarif is true)'
    required: false
    default: 'results.sarif'
  upload-sarif:
    description: 'Whether to upload SARIF report to GitHub Advanced Security / Code Scanning'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install C-GULL
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}[ast]"

    - name: Run C-GULL Scan
      shell: bash
      run: |
        ARGS=()

        if [ -n "${{ inputs.severity }}" ]; then
          ARGS+=("--severity" "${{ inputs.severity }}")
        fi

        if [ -n "${{ inputs.fail-on }}" ] && [ "${{ inputs.fail-on }}" != "none" ]; then
          ARGS+=("--fail-on" "${{ inputs.fail-on }}")
        fi

        if [ "${{ inputs.format }}" = "sarif" ] || [ "${{ inputs.upload-sarif }}" = "true" ]; then
          ARGS+=("--format" "sarif" "-o" "${{ inputs.sarif-file }}")
        elif [ -n "${{ inputs.format }}" ]; then
          ARGS+=("--format" "${{ inputs.format }}")
        fi

        read -r -a PATH_ARGS <<< "${{ inputs.path }}"
        ARGS+=("${PATH_ARGS[@]}")

        echo "Running: cgull scan ${ARGS[*]}"
        cgull scan "${ARGS[@]}"

    - name: Upload SARIF report
      if: ${{ (inputs.upload-sarif == 'true' || inputs.upload-sarif == true) && (success() || failure()) }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
